kind = "mobile"
previewPath = "/"
title = "Routine Flow"
description = "A focused mobile routine tracker that helps people save repeatable routines, run them step by step, and build consistency with gentle daily progress."
version = "1.0.0"
id = "artifacts/routine-flow"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24694

[services.development]
run = "pnpm --filter @workspace/routine-flow run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/routine-flow", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/routine-flow", "run", "serve" ]

[services.env]
PORT = "24694"
BASE_PATH = "/"
